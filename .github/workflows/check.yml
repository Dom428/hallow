# Checks the website on every push and pull request: every local image, link, script and stylesheet it points to
# exists. Nothing is published from here.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local files the page points to exist
        run: |
          python3 - <<'PY'
          import re, os, sys
          html = open('index.html', encoding='utf-8').read()
          refs = re.findall(r'(?:src|href)="([^"#?]+)', html)
          local = [r for r in refs if not re.match(r'^(https?:|mailto:|data:|//)', r)]
          missing = [r for r in local if not os.path.exists(r.lstrip('/'))]
          for m in missing: print(f'::error file=index.html::missing {m}')
          print(f'{len(local)} local references, {len(missing)} missing')
          sys.exit(1 if missing else 0)
          PY
